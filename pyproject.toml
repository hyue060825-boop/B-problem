[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm-b-workspace"
version = "0.3.0"
description = "国赛 B 题本地模拟、几何求解与策略研究工作区"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "requests>=2.28",
  "scipy>=1.10",
  "shapely>=2.0",
]

[project.optional-dependencies]
rl = ["torch>=2.2"]
test = ["pytest>=8"]

[project.scripts]
b-solution = "solution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bsim*", "solution*"]

[tool.setuptools.package-data]
bsim = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
