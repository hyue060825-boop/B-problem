[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "b-certified-solution"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "shapely>=2.0", "matplotlib>=3.7", "requests>=2.28"]
[project.optional-dependencies]
rl = ["torch>=2.2"]
test = ["pytest>=8"]
[project.scripts]
b-solution = "solution.cli:main"
[tool.setuptools.packages.find]
include = ["bsim*", "solution*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
